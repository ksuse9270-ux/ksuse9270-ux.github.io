<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦝 RACCOON TRASH WEB</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body {
  background:#110b22;
  background-image: radial-gradient(#332255 1px, transparent 1px);
  background-size:18px 18px;
  color:#fff;
  font-family:"MS Sans Serif", Tahoma, Verdana, sans-serif;
  padding:30px 10px;
}
.blink {
  animation: blink 1s infinite;
}
@keyframes blink {
  0%,100%{opacity:1}
  50%{opacity:0.3}
}
h1 {
  font-size:46px;
  text-align:center;
  color:#ffdd44;
  text-shadow:2px 2px #c83390;
}
.subtitle {
  text-align:center;
  color:#b9b9ff;
  margin:8px 0 16px;
}
.icon-row {
  text-align:center;
  font-size:28px;
  margin-bottom:24px;
  gap:16px;
  display:flex;
  justify-content:center;
}
/* 跑马灯 */
.marquee-wrap {
  border:1px solid #a066dd;
  background:#1c1233;
  max-width:920px;
  margin:0 auto 30px;
  overflow:hidden;
  padding:4px;
}
.marquee {
  white-space:nowrap;
  animation:marquee 14s linear infinite;
  color:#ffe8ff;
}
@keyframes marquee {
  from {transform:translateX(100%);}
  to {transform:translateX(-100%);}
}

/* ===== Win98窗口 核心！===== */
.win98-window {
  width:440px;
  margin:0 auto;
  background:#cacaff;
  border:3px outset #fff;
  box-shadow:4px 4px #00000060;
}
.win-titlebar {
  background:linear-gradient(90deg, #000080, #1040c0);
  padding:3px 6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  font-weight:bold;
  font-size:13px;
}
.win-close {
  background:#c0c0c0;
  border:1px outset white;
  width:18px;height:18px;
  text-align:center;
  cursor:pointer;
  color:black;
  font-weight:bold;
}
.win-content {
  background:#fff;
  padding:16px;
  min-height:420px;
  position:relative;
  text-align:center;
}
.raccoon-img {
  max-width:360px;
  max-height:380px;
}
/* 对话气泡 */
.bubble {
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:#111;
  padding:8px 12px;
  border-radius:14px;
  box-shadow:2px 2px #c83390;
  font-size:14px;
  z-index:2;
}
.bubble::after{
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:7px solid white;
}
/* 黄色emoji手贴纸 */
.hand-sticker {
  position:absolute;
  width:86px;
  z-index:3;
  pointer-events:none;
}

/* 按钮区域 */
.btn-area {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:900px;
  margin:24px auto 0;
}
.btn-area button {
  background:#281844;
  color:#ffdd44;
  border:2px outset #b877ee;
  padding:8px 14px;
  font-family:"MS Sans Serif";
  cursor:pointer;
}
.btn-area button:hover {
  background:#9955dd;
  color:#fff;
}
/* 右下角漂浮垃圾桶 */
.float-trash {
  position:fixed;
  right:24px;
  bottom:24px;
  font-size:42px;
  cursor:pointer;
  animation:float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
</style>
</head>
<body>
<h1 class="blink">🦝 RACCOON TRASH WEB 🦝</h1>
<p class="subtitle">「浣熊垃圾收集站 | 真实浣熊表情包 · 千禧梦核拼贴 · 互动宠物」</p>
<div class="icon-row">🗑️ 🛒 🗑️</div>

<div class="marquee-wrap">
  <div class="marquee">★ WELCOME TO RACCOON WORLD ★ 浣熊表情包 · 垃圾小偷图鉴 · 千禧拼贴收藏 ★ 点浣熊、切换表情、翻垃圾桶！★</div>
</div>

<!-- Win98窗口 -->
<div class="win98-window">
  <div class="win-titlebar">
    <span>untitled - Paint</span>
    <span class="win-close">X</span>
  </div>
  <div class="win-content">
    <div class="bubble" id="bubble">嗨，我是来偷垃圾的</div>
    <img id="handEl" class="hand-sticker" style="display:none;">
    <img id="raccoon" class="raccoon-img" src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/31120102083c40389112020140412311~tplv-a9rns2rl98-image.image">
  </div>
</div>

<div class="btn-area">
  <button onclick="switchRac(0)">👋 摊手浣熊</button>
  <button onclick="switchRac(1)">🤓 眼镜浣熊</button>
  <button onclick="switchRac(2)">🔍 探头浣熊</button>
</div>

<div class="float-trash" onclick="switchRac(0)">🗑️</div>

<script>
const raccoon = document.getElementById('raccoon');
const bubble = document.getElementById('bubble');
const handEl = document.getElementById('handEl');

// 直接用你上传的浣熊原图链接，不会黑屏
const raccoonData = [
  {
    img:"https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/31120102083c40389112020140412311~tplv-a9rns2rl98-image.image",
    text:"不是我偷的，是垃圾先诱惑我",
    hand:"https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/20012130024040388240212440013271~tplv-a9rns2rl98-image.image",
    handPos:"top:180px; left:20px;"
  },
  {
    img:"https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/22113100124440818310211440401361~tplv-a9rns2rl98-image.image",
    text:"戴上眼镜，我就是文化垃圾小偷",
    hand:"https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/20012130024040388240212440013271~tplv-a9rns2rl98-image.image",
    handPos:"top:170px; right:20px;"
  },
  {
    img:"https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/31120102083c40389112020140412311~tplv-a9rns2rl98-image.image",
    text:"我看看哪里有垃圾袋",
    hand:"",
    handPos:"display:none"
  }
];

function switchRac(idx) {
  const item = raccoonData[idx];
  raccoon.src = item.img;
  bubble.innerText = item.text;

  if(item.hand){
    handEl.src = item.hand;
    handEl.style.cssText = item.handPos;
    handEl.style.display = "block";
  }else{
    handEl.style.display = "none";
  }
}

// 点击浣熊随机台词
raccoon.onclick = ()=>{
  const lines = [
    "别点我，我正在找垃圾桶",
    "塑料袋是世界上最好的宝物",
    "我看起来可爱，但会抢零食",
    "要不要和我一起翻垃圾？"
  ]
  const rnd = lines[Math.floor(Math.random()*lines.length)];
  bubble.innerText = rnd;
}
</script>
</body>
</html>
